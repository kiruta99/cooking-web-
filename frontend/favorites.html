<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Favorites | CookWise</title>
    <meta name="description" content="View, search, and manage your saved CookWise recipes.">
    <link rel="stylesheet" href="./css/style.css">
    <link rel="stylesheet" href="./css/recipe.css">
    <style>
        body { background: #F1F5F9; }

        .page-header { padding: 40px 0 28px; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 16px; }
        .page-header h1 { font-size: 36px; }

        .favorites-toolbar {
            display: flex; gap: 12px; align-items: center;
            margin-bottom: 28px; flex-wrap: wrap;
        }

        .search-box {
            flex: 1; min-width: 200px;
            display: flex; align-items: center;
            background: var(--clr-white);
            border: 1px solid var(--clr-border);
            border-radius: var(--radius-full);
            padding: 0 16px; gap: 8px;
            box-shadow: var(--shadow-sm);
        }

        .search-box input {
            border: none; background: transparent;
            font-family: var(--font-body); font-size: 15px;
            padding: 12px 0; flex: 1; outline: none;
        }

        .count-badge {
            background: var(--clr-primary);
            color: white;
            border-radius: var(--radius-full);
            padding: 6px 16px;
            font-size: 14px; font-weight: 600;
        }

        /* Grid */
        .favorites-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 24px;
            margin-bottom: 80px;
        }

        /* Override recipe-card to add remove button */
        .recipe-card .remove-fav {
            position: absolute;
            top: 12px; left: 12px;
            background: rgba(0,0,0,0.55);
            border: none;
            color: #FF6B6B;
            border-radius: var(--radius-full);
            padding: 4px 10px;
            font-size: 13px; font-weight: 700;
            cursor: pointer; display: none;
            transition: var(--transition-fast);
        }

        .recipe-card:hover .remove-fav { display: block; }

        .recipe-card .img-wrap { position: relative; }

        /* Empty state */
        .empty-favorites {
            grid-column: 1 / -1;
            text-align: center;
            padding: 80px 20px;
            background: var(--clr-white);
            border-radius: var(--radius-lg);
        }

        .empty-favorites .icon { font-size: 64px; opacity: 0.4; margin-bottom: 20px; }
        .empty-favorites h3 { margin-bottom: 8px; }
        .empty-favorites p  { color: var(--clr-text-muted); margin-bottom: 24px; }
    </style>
</head>
<body>
<nav class="navbar">
    <div class="container">
        <a href="index.html" class="logo">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M2 12h20"/><path d="M20 12v8a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2v-8"/>
                <path d="M4 12V8a4 4 0 0 1 4-4h8a4 4 0 0 1 4 4v4"/>
            </svg>
            Cook<span>Wise</span>
        </a>
        <div class="nav-links">
            <a href="index.html">Home</a>
            <a href="recipes.html">Recipes</a>
            <a href="dashboard.html" class="btn btn-outline">Dashboard</a>
            <button class="btn btn-primary" id="nav-logout-btn">Logout</button>
        </div>
    </div>
</nav>

<main class="container">
    <div class="page-header">
        <div>
            <h1>❤️ My Favorites</h1>
            <p style="color:var(--clr-text-muted);">Your saved recipes from TheMealDB</p>
        </div>
        <a href="recipes.html" class="btn btn-accent">🔍 Discover More Recipes</a>
    </div>

    <div class="favorites-toolbar">
        <div class="search-box">
            <span>🔍</span>
            <input type="text" id="fav-search" placeholder="Search your saved recipes…"
                   oninput="filterFavorites(this.value)">
        </div>
        <div class="count-badge" id="fav-count">Loading…</div>
    </div>

    <div class="favorites-grid" id="favorites-grid">
        <!-- Skeleton -->
        <div class="recipe-card"><div class="skeleton recipe-img-container"></div><div class="recipe-content"><div class="skeleton skeleton-text"></div></div></div>
        <div class="recipe-card"><div class="skeleton recipe-img-container"></div><div class="recipe-content"><div class="skeleton skeleton-text"></div></div></div>
        <div class="recipe-card"><div class="skeleton recipe-img-container"></div><div class="recipe-content"><div class="skeleton skeleton-text"></div></div></div>
    </div>
</main>

<script src="./js/app.js"></script>
<script>
let allFavorites = [];

document.addEventListener('DOMContentLoaded', async () => {
    const user = await window.authPromise;
    if (!user) { window.location.href = 'login.html'; return; }
    loadFavorites();
});

async function loadFavorites() {
    try {
        const res = await fetch(`${API_BASE_URL}/favorites`);
        if (!res.ok) throw new Error('API error');
        const data = await res.json();
        allFavorites = data.favorites || [];
        renderFavorites(allFavorites);
    } catch (e) {
        document.getElementById('favorites-grid').innerHTML =
            '<p style="color:var(--clr-danger);">Unable to load favorites. Please refresh.</p>';
    }
}

function renderFavorites(items) {
    const grid  = document.getElementById('favorites-grid');
    const badge = document.getElementById('fav-count');
    badge.textContent = `${items.length} saved`;

    if (items.length === 0) {
        grid.innerHTML = `
            <div class="empty-favorites">
                <div class="icon">❤️</div>
                <h3>No saved recipes yet</h3>
                <p>Browse recipes and tap ❤️ to save your favourites here.</p>
                <a href="recipes.html" class="btn btn-primary">Discover Recipes</a>
            </div>`;
        return;
    }

    grid.innerHTML = items.map(f => `
        <div class="recipe-card" style="position:relative;">
            <div class="img-wrap" style="position:relative;">
                <div class="recipe-img-container">
                    <img src="${f.meal_thumb}" alt="${f.meal_name}" loading="lazy">
                </div>
                <button class="remove-fav" onclick="removeFav(${f.id}, event)">✕ Remove</button>
            </div>
            <div class="recipe-content">
                <h3 class="recipe-title">${f.meal_name}</h3>
                <div class="recipe-meta">
                    <div class="meta-item"><span class="meta-icon">🔥</span> ${getStableKcal(f)} kcal</div>
                    <div class="meta-item" style="font-size:12px; color:var(--clr-text-muted);">
                        Saved ${new Date(f.created_at).toLocaleDateString()}
                    </div>
                </div>
                <div class="recipe-actions" style="margin-top:12px;">
                    <a href="recipe-details.html?id=${f.meal_id}" class="btn btn-primary"
                       style="padding:8px 16px; font-size:14px;">View Recipe</a>
                    <button onclick="removeFav(${f.id}, event)"
                        style="background:none; border:none; color:var(--clr-danger);
                               cursor:pointer; font-size:14px; font-weight:600; padding:8px;">
                        🗑️ Remove
                    </button>
                </div>
            </div>
        </div>`).join('');
}

function filterFavorites(query) {
    const filtered = allFavorites.filter(f =>
        f.meal_name.toLowerCase().includes(query.toLowerCase())
    );
    renderFavorites(filtered);
}

async function removeFav(id, event) {
    event.preventDefault();
    event.stopPropagation();
    try {
        const res = await fetch(`${API_BASE_URL}/favorites/${id}`, { method: 'DELETE' });
        if (res.ok) {
            allFavorites = allFavorites.filter(f => f.id !== id);
            renderFavorites(allFavorites);
        }
    } catch (e) { alert('Network error.'); }
}
</script>
</body>
</html>
