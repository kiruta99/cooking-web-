<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Settings | CookWise</title>
    <link rel="stylesheet" href="./css/style.css">
    <link rel="stylesheet" href="./css/recipe.css">
    <style>
        body { background: #F1F5F9; }

        /* ── Layout ─────────────────────────────────────────── */
        .dash-layout {
            display: grid;
            grid-template-columns: 260px 1fr;
            gap: 32px;
            margin-top: 32px;
            margin-bottom: 80px;
        }

        /* ── Sidebar ─────────────────────────────────────────── */
        .sidebar {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .sidebar-profile {
            background: var(--clr-white);
            border-radius: var(--radius-md);
            padding: 24px;
            text-align: center;
            box-shadow: var(--shadow-sm);
        }

        .sidebar-avatar {
            width: 72px; height: 72px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--clr-primary), var(--clr-accent));
            display: flex; align-items: center; justify-content: center;
            font-size: 28px; margin: 0 auto 12px;
            color: white; font-family: var(--font-heading); font-weight: 700;
        }

        .sidebar-name { font-size: 18px; font-weight: 700; margin-bottom: 4px; }
        .sidebar-email { font-size: 13px; color: var(--clr-text-muted); }

        .sidebar-menu {
            background: var(--clr-white);
            border-radius: var(--radius-md);
            padding: 8px 0;
            box-shadow: var(--shadow-sm);
        }

        .menu-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 12px 20px;
            color: var(--clr-text-muted);
            font-weight: 500;
            font-size: 15px;
            border-left: 3px solid transparent;
            transition: var(--transition-fast);
            text-decoration: none;
        }

        .menu-item:hover, .menu-item.active {
            background: #F0FDF4;
            color: var(--clr-primary);
            border-left-color: var(--clr-primary);
        }

        .menu-divider {
            height: 1px;
            background: var(--clr-border);
            margin: 8px 20px;
        }

        /* ── Main content ────────────────────────────────────── */
        .dash-main { display: flex; flex-direction: column; gap: 28px; }

        /* ── Welcome bar ─────────────────────────────────────── */
        .welcome-bar {
            background: linear-gradient(135deg, var(--clr-primary-dark), var(--clr-primary));
            border-radius: var(--radius-md);
            padding: 28px 32px;
            color: white;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
            flex-wrap: wrap;
            box-shadow: var(--shadow-md);
        }

        .welcome-bar h1 { font-size: 26px; margin-bottom: 4px; }
        .welcome-bar p  { opacity: 0.8; font-size: 14px; }

        /* ── Stats grid ──────────────────────────────────────── */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
        }

        .stat-card {
            background: var(--clr-white);
            border-radius: var(--radius-md);
            padding: 24px;
            box-shadow: var(--shadow-sm);
            display: flex;
            align-items: center;
            gap: 20px;
            cursor: pointer;
            transition: var(--transition-normal);
            text-decoration: none;
            color: inherit;
        }

        .stat-card:hover { transform: translateY(-4px); box-shadow: var(--shadow-md); }

        .stat-icon {
            width: 56px; height: 56px;
            border-radius: var(--radius-sm);
            display: flex; align-items: center; justify-content: center;
            font-size: 24px;
            flex-shrink: 0;
        }

        .stat-icon.green  { background: #DCFCE7; }
        .stat-icon.orange { background: #FEF3C7; }
        .stat-icon.blue   { background: #DBEAFE; }

        .stat-number {
            font-size: 32px; font-weight: 800;
            font-family: var(--font-heading);
            color: var(--clr-text-main);
            line-height: 1;
            margin-bottom: 4px;
        }

        .stat-label { font-size: 13px; color: var(--clr-text-muted); font-weight: 500; }

        /* ── Calorie widget ──────────────────────────────────── */
        .calorie-widget {
            background: linear-gradient(135deg, #0B192C, var(--clr-primary-dark));
            border-radius: var(--radius-md);
            padding: 28px 32px;
            color: white;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 24px;
            box-shadow: var(--shadow-md);
        }

        .calorie-widget-number {
            font-size: 48px; font-weight: 800;
            font-family: var(--font-heading);
            color: var(--clr-highlight); line-height: 1; margin-bottom: 6px;
        }

        .calorie-widget-left h3 {
            font-size: 12px; letter-spacing: 2px;
            text-transform: uppercase; opacity: 0.7; margin-bottom: 8px;
        }

        .calorie-widget-sub {
            font-size: 13px; opacity: 0.75;
            display: flex; flex-direction: column; gap: 4px;
        }

        .calorie-widget-right { flex-shrink: 0; }

        .calorie-widget-empty {
            background: var(--clr-white);
            border: 2px dashed var(--clr-border);
            border-radius: var(--radius-md);
            padding: 24px 32px;
            display: flex; align-items: center;
            justify-content: space-between;
            gap: 24px;
        }

        /* ── Quick actions ───────────────────────────────────── */
        .quick-actions {
            background: var(--clr-white);
            border-radius: var(--radius-md);
            padding: 28px;
            box-shadow: var(--shadow-sm);
        }

        .quick-actions h3 { margin-bottom: 20px; font-size: 18px; }

        .qa-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 16px;
        }

        .qa-card {
            display: flex; flex-direction: column; align-items: center;
            gap: 10px; padding: 20px 12px;
            border: 2px solid var(--clr-border);
            border-radius: var(--radius-md);
            cursor: pointer; text-decoration: none; color: inherit;
            transition: var(--transition-fast);
            text-align: center;
        }

        .qa-card:hover {
            border-color: var(--clr-primary);
            background: #F0FDF4;
            color: var(--clr-primary);
        }

        .qa-icon { font-size: 28px; }
        .qa-label { font-size: 13px; font-weight: 600; }

        /* ── Favorites section ───────────────────────────────── */
        .section-card {
            background: var(--clr-white);
            border-radius: var(--radius-md);
            padding: 28px;
            box-shadow: var(--shadow-sm);
        }

        .section-header {
            display: flex; align-items: center; justify-content: space-between;
            margin-bottom: 20px;
        }

        .section-header h3 { font-size: 18px; }
        .section-header a  { font-size: 14px; color: var(--clr-primary); font-weight: 600; }

        .fav-item {
            display: flex; gap: 16px;
            padding: 12px 0; border-bottom: 1px solid var(--clr-border);
            align-items: center;
        }

        .fav-item:last-child { border-bottom: none; padding-bottom: 0; }

        .fav-img {
            width: 56px; height: 56px;
            border-radius: var(--radius-sm); object-fit: cover; flex-shrink: 0;
        }

        .fav-info { flex: 1; }
        .fav-name { font-weight: 600; font-size: 15px; margin-bottom: 4px; }
        .fav-actions { display: flex; gap: 8px; align-items: center; }

        /* Loading skeleton */
        .skeleton-row {
            display: flex; gap: 16px; padding: 12px 0; align-items: center;
        }
        .skeleton-sq  { width: 56px; height: 56px; flex-shrink: 0; border-radius: var(--radius-sm); }
        .skeleton-lines { flex: 1; display: flex; flex-direction: column; gap: 8px; }

        /* Responsive */
        @media (max-width: 900px) {
            .dash-layout { grid-template-columns: 1fr; }
            .stats-grid  { grid-template-columns: repeat(2, 1fr); }
            .qa-grid     { grid-template-columns: repeat(2, 1fr); }
        }

        @media (max-width: 600px) {
            .stats-grid  { grid-template-columns: 1fr; }
            .qa-grid     { grid-template-columns: repeat(2, 1fr); }
            .welcome-bar { flex-direction: column; text-align: center; }
        }
    </style>
</head>
<body>

        <div class="dash-main">
        <div class="section-card" style="max-width: 600px; margin: 0 auto;">
            <div class="section-header">
                <h3>Change Password</h3>
            </div>
            <form id="change-password-form">
                <div class="input-group mb-3">
                    <label>Current Password</label>
                    <input type="password" id="current-password" class="input-control" required>
                </div>
                <div class="input-group mb-3">
                    <label>New Password</label>
                    <input type="password" id="new-password" class="input-control" minlength="5" maxlength="20" required>
                </div>
                <div class="input-group mb-3">
                    <label>Confirm New Password</label>
                    <input type="password" id="confirm-password" class="input-control" minlength="5" maxlength="20" required>
                </div>
                <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 10px;">Change Password</button>
                <div id="password-msg" style="margin-top:16px; font-weight:600; text-align:center;"></div>
