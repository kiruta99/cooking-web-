<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | CookWise</title>
    <link rel="stylesheet" href="./css/style.css">
    <link rel="stylesheet" href="./css/recipe.css">
</head>
<body style="background: var(--clr-bg); display: flex; flex-direction: column; min-height: 100vh;">
    <nav class="navbar">
        <div class="container">
            <a href="index.html" class="logo">Cook<span>Wise</span></a>
            <div class="nav-links">
                <a href="index.html">Home</a>
                <a href="recipes.html">Recipes</a>
            </div>
        </div>
    </nav>

    <main class="container" style="flex: 1;">
        <div class="auth-container">
            <div class="auth-header">
                <h1>Join CookWise</h1>
                <p>Create an account to save recipes and meal plans.</p>
            </div>
            
            <form id="register-form">
                <div class="input-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" class="input-control" required>
                </div>
                <div class="input-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" class="input-control" required>
                </div>
                <div class="input-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" class="input-control" minlength="5" maxlength="20" required>
                </div>
                <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 16px;">Create Account</button>
            </form>
            
            <div class="auth-footer">
                Already have an account? <a href="login.html">Login here</a>
            </div>
        </div>
    </main>

    <script src="./js/app.js"></script>
    <script>
        document.getElementById('register-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const username = document.getElementById('username').value;
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            
            if (password.length < 5) {
                alert('Password must be at least 5 characters.');
                return;
            }
            if (password.length > 20) {
                alert('Password must not exceed 20 characters.');
                return;
            }
            
            try {
                const res = await fetch(`${API_BASE_URL}/auth/register`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, email, password })
                });
                
                const data = await res.json();
                if (res.ok) {
                    alert('Registration successful!');
                    window.location.href = 'dashboard.html';
                } else {
                    alert(data.error);
                }
            } catch (err) {
                alert('Network error.');
            }
        });
    </script>
</body>
</html>
